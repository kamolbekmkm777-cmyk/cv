<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fotogalereya — Kamolbek Muzaffarov</title>
<meta name="theme-color" content="#08080a" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="style.css" />
<style>
  /* Page-specific chrome; the gallery/lightbox styles come from style.css. */
  .gwrap{ max-width:var(--maxw); margin:0 auto; padding:96px 22px 80px; }
  .ghead{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    margin-bottom:28px; flex-wrap:wrap;
  }
  .ghead__t h1{ font-family:var(--disp); font-size:clamp(26px,5vw,42px); font-weight:800; line-height:1.05; }
  .ghead__t p{ color:var(--muted); font-size:14px; margin-top:4px; }
  .gback{
    display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px;
    background:var(--glass-bg); border:1px solid var(--glass-line); color:var(--fg);
    backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    font-size:13px; font-weight:600; transition:border-color .2s, transform .2s;
  }
  .gback:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .gempty{ color:var(--muted); padding:40px 0; text-align:center; }
</style>
</head>
<body data-theme="liquid">

<div class="bg" aria-hidden="true">
  <span class="bg__blob bg__blob--1"></span>
  <span class="bg__blob bg__blob--2"></span>
  <video class="bg__video" id="bgVideo" muted loop playsinline preload="none" aria-hidden="true"></video>
  <span class="bg__tint"></span>
</div>

<a class="brand" href="index.html" aria-label="Bosh sahifa">
  <svg class="brand__mk" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path d="M2.31 50L2.31 100L7.95 100L13.58 100L13.62 58.58L13.66 17.18L21.23 26.18L28.8 35.19L34.21 41.58L39.62 47.97L39.75 73.9L39.86 99.84L44.82 99.84L49.77 99.84L49.86 92.48L49.98 85.1L49.98 72.66L49.98 60.23L50.1 60.24L50.22 60.24L55.84 66.96L61.47 73.67L72.58 86.84L83.71 100L90.59 99.97L97.45 99.92L97.58 99.81L97.69 99.68L95.82 97.39L93.97 95.09L86.05 85.67L78.12 76.25L68.75 65.06L59.36 53.86L55.39 49.15L51.43 44.43L51.43 44.28L51.43 44.14L52.36 43.04L53.31 41.95L56.82 38.16L60.35 34.38L73.97 19.81L87.59 5.23L89.91 2.74L92.23 0.24L91.28 0.14L90.31 0.03L84.74 0.02L79.15 0L77 2.29L74.84 4.59L71.05 8.7L67.29 12.8L57.21 23.83L47.11 34.86L46.24 35.78L45.37 36.71L45.19 36.71L45 36.71L42.36 33.61L39.73 30.52L32.83 22.38L25.92 14.25L20.59 8.07L15.27 1.88L14.47 0.95L13.66 0L8 0L2.31 0L2.31 50Z"/></svg>
</a>

<main class="gwrap">
  <div class="ghead">
    <div class="ghead__t">
      <h1 id="gTitle">Fotogalereya</h1>
      <p id="gSub"></p>
    </div>
    <a class="gback" href="index.html">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      <span id="gBack">Saytga qaytish</span>
    </a>
  </div>
  <div class="gallery" id="galleryWrap"></div>
  <p class="gempty" id="gEmpty" hidden>Hali rasm yoʻq.</p>
</main>

<!-- Lightbox -->
<div class="lbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Rasm">
  <button class="lbox__x" id="lbClose" aria-label="Yopish">×</button>
  <button class="lbox__nav lbox__nav--prev" id="lbPrev" aria-label="Oldingi">‹</button>
  <img id="lbImg" alt="" />
  <button class="lbox__nav lbox__nav--next" id="lbNext" aria-label="Keyingi">›</button>
  <p class="lbox__cap" id="lbCap"></p>
</div>

<script src="config.js" onerror="window.__noConfig=1"></script>
<script src="data.js"></script>
<script src="cloud.js"></script>
<script>
/* Standalone gallery page. It reuses the SAME data sources as the main site so
   whatever the admin publishes shows up here too, with no build step:
     1. Supabase (if configured)   — authoritative, shared by everyone
     2. localStorage 'cvData'      — this browser's copy (set by index.html)
     3. window.DEPLOYED_DATA        — data.js baked at deploy time
     4. built-in photo-01..27       — the shipped default set
   Language + theme mirror the main site via localStorage. */
(() => {
'use strict';
const $ = s => document.querySelector(s);
const LANGS = ['uz','en','ru'];
const lang = (() => { try { const s = localStorage.getItem('cvLang'); if (LANGS.includes(s)) return s; } catch {} return 'uz'; })();
const L = v => {
  if (v == null) return '';
  if (typeof v === 'string') return v;
  if (typeof v === 'object') return v[lang] || v.uz || v.en || v.ru || '';
  return String(v);
};
const STR = {
  title:{ uz:'Fotogalereya', en:'Photo gallery', ru:'Фотогалерея' },
  back: { uz:'Saytga qaytish', en:'Back to site', ru:'На сайт' },
  empty:{ uz:'Hali rasm yoʻq.', en:'No photos yet.', ru:'Фото пока нет.' },
  sub:  { uz:'rasm', en:'photos', ru:'фото' }
};
const t = k => STR[k][lang] || STR[k].uz;

const defaultGallery = () => Array.from({ length: 27 }, (_, i) => {
  const n = String(i + 1).padStart(2, '0');
  return { id: 'p' + n, src: `assets/gallery/photo-${n}.jpg`, thumb: `assets/gallery/thumb/photo-${n}.jpg`, caption: '' };
});

async function loadData(){
  // Theme first (cheap, from localStorage) so the page doesn't flash.
  try {
    const s = JSON.parse(localStorage.getItem('cvData') || 'null');
    if (s?.theme) document.body.dataset.theme = s.theme;
  } catch {}

  // 1) Supabase
  if (window.Cloud?.enabled){
    try { await window.Cloud.init(); const r = await window.Cloud.load(); if (r) return r; } catch(e){ console.warn('cloud', e); }
  }
  // 2) this browser's saved copy
  try { const s = JSON.parse(localStorage.getItem('cvData') || 'null'); if (s && Array.isArray(s.gallery)) return s; } catch {}
  // 3) deploy-time data.js
  if (window.DEPLOYED_DATA && Array.isArray(window.DEPLOYED_DATA.gallery)) return window.DEPLOYED_DATA;
  // 4) shipped defaults — including the default sky video, so a visitor who
  //    lands here first still gets the same background as the main page
  return {
    gallery: defaultGallery(),
    bgVideo: { enabled:true, presetId:'clouds', src:'', opacity:70, tint:55 },
    videos: [{ id:'clouds', url:'https://archive.org/download/pixabay-21285/video-21285_source.mp4' }]
  };
}

let photos = [];
function render(){
  document.documentElement.lang = lang;
  $('#gTitle').textContent = t('title');
  $('#gBack').textContent = t('back');
  $('#gEmpty').textContent = t('empty');
  const w = $('#galleryWrap');
  photos = (data?.gallery || []).filter(g => g && g.src);
  if (data?.profile?.name) document.title = `${t('title')} — ${data.profile.name}`;
  $('#gSub').textContent = photos.length ? `${photos.length} ${t('sub')}` : '';
  if (!photos.length){ w.innerHTML = ''; $('#gEmpty').hidden = false; return; }
  $('#gEmpty').hidden = true;
  w.innerHTML = photos.map((g, i) => {
    const cap = L(g.caption);
    return `<figure class="gphoto" data-lb="${i}">
      <img src="${(g.thumb || g.src)}" alt="${cap || 'Foto ' + (i+1)}" loading="lazy" decoding="async">
      ${cap ? `<figcaption>${cap}</figcaption>` : ''}
    </figure>`;
  }).join('');
}

/* Lightbox */
function initLightbox(){
  const box = $('#lightbox'), img = $('#lbImg'), cap = $('#lbCap');
  let i = 0;
  const show = n => {
    if (!photos.length) return;
    i = (n + photos.length) % photos.length;
    img.src = photos[i].src;
    img.alt = L(photos[i].caption) || `Foto ${i+1}`;
    cap.textContent = L(photos[i].caption) || '';
  };
  const open = n => { show(n); box.classList.add('open'); box.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; };
  const close = () => { box.classList.remove('open'); box.setAttribute('aria-hidden','true'); document.body.style.overflow=''; img.removeAttribute('src'); };
  $('#galleryWrap').addEventListener('click', e => { const f = e.target.closest('[data-lb]'); if (f) open(+f.dataset.lb); });
  $('#lbClose').onclick = close;
  $('#lbPrev').onclick = e => { e.stopPropagation(); show(i-1); };
  $('#lbNext').onclick = e => { e.stopPropagation(); show(i+1); };
  box.addEventListener('click', e => { if (e.target === box || e.target === img) close(); });
  addEventListener('keydown', e => {
    if (!box.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(i-1);
    if (e.key === 'ArrowRight') show(i+1);
  });
}

/* Background video — the same one the admin set for the main site. The
   config travels in the same data document, so whatever plays on index.html
   plays here. Sand theme hides it via the shared CSS. */
function applyBgVideo(){
  const v = document.getElementById('bgVideo'), bg = document.querySelector('.bg');
  const cfg = data?.bgVideo; if (!v || !bg || !cfg) return;
  bg.style.setProperty('--bgv-op',   (Number(cfg.opacity ?? 70))/100);
  bg.style.setProperty('--bgv-tint', (Number(cfg.tint ?? 55))/100);
  const custom = String(cfg.src||'').trim();
  const preset = (data.videos||[]).find(x => x.id === cfg.presetId);
  const src = custom || preset?.url || '';
  if (!cfg.enabled || !src) return;
  bg.classList.add('video-on');
  v.src = src;
  v.addEventListener('loadeddata', () => { v.classList.add('on'); v.play().catch(()=>{}); }, { once:true });
  v.load();
}

let data = null;
(async () => {
  data = await loadData();
  render();
  initLightbox();
  applyBgVideo();
})();
})();
</script>
</body>
</html>
