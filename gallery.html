<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fotogalereya — Kamolbek Muzaffarov</title>
<meta name="theme-color" content="#0A0A0B" />
<meta name="description" content="Kamolbek Muzaffarov — fotogalereya." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Fotogalereya — Kamolbek Muzaffarov" />
<meta property="og:image" content="https://kamolbek.com/assets/kamolbek-900.jpg" />
<meta property="og:url" content="https://kamolbek.com/gallery" />
<link rel="canonical" href="https://kamolbek.com/gallery" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260819a" />
<style>
  .gwrap{ max-width:var(--maxw); margin:0 auto; padding:96px 22px 80px; }
  .ghead{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    margin-bottom:28px; flex-wrap:wrap;
  }
  .ghead__t h1{ font-family:var(--disp); font-size:clamp(24px,5vw,40px); font-weight:800; line-height:1.05; }
  .ghead__t p{ color:var(--muted); font-size:14px; margin-top:4px; }
  .gback{
    display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px;
    background:var(--glass-bg); border:1px solid var(--glass-line); color:var(--fg);
    backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    font-size:13px; font-weight:600; transition:border-color .2s, transform .2s;
  }
  .gback:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .gempty{ color:var(--muted); padding:40px 0; text-align:center; }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<a class="brand" href="/" aria-label="Bosh sahifa">
  <img class="brand__mk" id="brandImg" src="assets/logo-mk.png?v=20260819a" alt="MK" />
</a>

<main class="gwrap">
  <div class="ghead">
    <div class="ghead__t">
      <h1 id="gTitle">Fotogalereya</h1>
      <p id="gSub"></p>
    </div>
    <a class="gback" href="/">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      <span id="gBack">Saytga qaytish</span>
    </a>
  </div>
  <div class="gallery" id="galleryWrap"></div>
  <p class="gempty" id="gEmpty" hidden>Hali rasm yoʻq.</p>
</main>

<!-- Lightbox -->
<div class="lbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Rasm">
  <button class="lbox__x" id="lbClose" aria-label="Yopish">×</button>
  <button class="lbox__nav lbox__nav--prev" id="lbPrev" aria-label="Oldingi">‹</button>
  <img id="lbImg" alt="" />
  <button class="lbox__nav lbox__nav--next" id="lbNext" aria-label="Keyingi">›</button>
  <p class="lbox__cap" id="lbCap"></p>
</div>

<div class="toast" id="toast"></div>

<script src="config.js?v=20260819a" onerror="window.__noConfig=1"></script>
<script src="data.js?v=20260819a"></script>
<script src="cloud.js?v=20260819a"></script>
<script src="core.js?v=20260819a"></script>
<script>
/* Standalone gallery page — same data chain as the main site via core.js. */
(() => {
'use strict';
const CV = window.CV;
const { $, esc, L } = CV;

const STR = {
  title:{ uz:'Fotogalereya', en:'Photo gallery', ru:'Фотогалерея' },
  back: { uz:'Saytga qaytish', en:'Back to site', ru:'На сайт' },
  empty:{ uz:'Hali rasm yoʻq.', en:'No photos yet.', ru:'Фото пока нет.' },
  sub:  { uz:'rasm', en:'photos', ru:'фото' }
};
const t = k => STR[k][CV.lang] || STR[k].uz;

let photos = [];
function render(){
  document.documentElement.lang = CV.lang;
  CV.applyBranding();
  $('#gTitle').textContent = t('title');
  $('#gBack').textContent = t('back');
  $('#gEmpty').textContent = t('empty');
  const w = $('#galleryWrap');
  photos = (CV.data.gallery || []).filter(g => g && g.src);
  document.title = `${t('title')} — ${CV.data.profile.name} (MKM777)`;
  $('#gSub').textContent = photos.length ? `${photos.length} ${t('sub')}` : '';
  if (!photos.length){ w.innerHTML = ''; $('#gEmpty').hidden = false; return; }
  $('#gEmpty').hidden = true;
  // Lokal jpg'lar uchun AVIF variantlar deploy'da yonma-yon yotadi (~3x kichik).
  const avif = s => /^assets\/.+\.jpe?g$/i.test(s) ? s.replace(/\.jpe?g$/i, '.avif') : '';
  w.innerHTML = photos.map((g, i) => {
    const cap = L(g.caption);
    const src = g.thumb || g.src, av = avif(src);
    return `<figure class="gphoto" data-lb="${i}">
      <picture>
        ${av ? `<source type="image/avif" srcset="${esc(av)}">` : ''}
        <img src="${esc(src)}" alt="${esc(cap || 'Foto ' + (i+1))}" loading="lazy" decoding="async">
      </picture>
      ${cap ? `<figcaption>${esc(cap)}</figcaption>` : ''}
    </figure>`;
  }).join('');
}

function initLightbox(){
  const box = $('#lightbox'), img = $('#lbImg'), cap = $('#lbCap');
  let i = 0;
  const show = n => {
    if (!photos.length) return;
    i = (n + photos.length) % photos.length;
    img.src = photos[i].src;
    img.alt = L(photos[i].caption) || `Foto ${i+1}`;
    cap.textContent = L(photos[i].caption) || '';
  };
  const open = n => { show(n); box.classList.add('open'); box.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; };
  const close = () => { box.classList.remove('open'); box.setAttribute('aria-hidden','true'); document.body.style.overflow=''; img.removeAttribute('src'); };
  $('#galleryWrap').addEventListener('click', e => { const f = e.target.closest('[data-lb]'); if (f) open(+f.dataset.lb); });
  $('#lbClose').onclick = close;
  $('#lbPrev').onclick = e => { e.stopPropagation(); show(i-1); };
  $('#lbNext').onclick = e => { e.stopPropagation(); show(i+1); };
  box.addEventListener('click', e => { if (e.target === box || e.target === img) close(); });
  addEventListener('keydown', e => {
    if (!box.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(i-1);
    if (e.key === 'ArrowRight') show(i+1);
  });
}

(async () => {
  render();
  initLightbox();
  try { if (await CV.loadCloud()) render(); }
  catch(e){ console.warn('cloud', e); }
})();
})();
</script>
</body>
</html>
