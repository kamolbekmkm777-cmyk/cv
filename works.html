<style>
  /* Page chrome; cards, chips, certificates and the lightbox come from style.css. */
  /* the main page tints its links with the background video's colour */
  [data-theme="liquid"]{ --accent:#46a1d8; --accent2:#7e90dd; --accent-dim:rgba(70,161,216,.16); --accent-edge:rgba(70,161,216,.25); }
  .gwrap{ max-width:var(--maxw); margin:0 auto; padding:104px 22px 90px; }
  .whead{ text-align:center; margin-bottom:30px; }
  .wtitle{
    display:inline-block; font-family:Syne, sans-serif; font-weight:800; letter-spacing:-.02em;
    font-size:clamp(44px, 8vw, 96px); line-height:1.05; color:#fff; margin:0; padding:0 .1em;
    text-shadow:0 2px 24px rgba(0,0,0,.3);
  }
  .whead p{ color:var(--muted); font-size:14px; margin:8px 0 0; }
  .wtabs{ display:inline-flex; gap:6px; margin-top:22px; padding:5px; border-radius:999px;
    background:var(--lg-bg); border:1px solid var(--lg-line); box-shadow:var(--lg-shadow);
    -webkit-backdrop-filter:var(--lg-blur); backdrop-filter:var(--lg-blur); }
  .wtab{ display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 16px; border-radius:999px;
    font-size:14px; font-weight:600; color:var(--muted); transition:color .2s, background-color .2s; }
  .wtab b{ min-width:24px; padding:2px 8px; border-radius:999px; font-size:12px; background:rgba(255,255,255,.1); }
  .wtab:hover{ color:var(--fg); }
  .wtab.active{
    color:#fff;
    background:radial-gradient(120% 140% at 30% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 55%), rgba(255,255,255,.18);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.45), 0 6px 16px -6px rgba(0,60,120,.45);
  }
  [data-theme="sculpt"] .wtab.active{ background:#151514; color:#F3F1EC; box-shadow:none; }
  [data-pane] .chips{ justify-content:center; margin:0 0 22px; }
  .chip__n{ font-weight:600; opacity:.7; margin-left:2px; }
  .cgroup{ margin-top:34px; }
  .cgroup:first-child{ margin-top:0; }
  .cgroup__h{ display:flex; align-items:baseline; gap:10px; font-family:var(--disp); font-size:22px; font-weight:700; margin:0 0 14px; }
  .cgroup__h span{ font-size:13px; font-weight:600; color:var(--muted); }
  .cgroup .certs{ margin-top:0; }
  .pback{
    position:fixed; top:16px; left:16px; z-index:900; width:50px; height:50px; border-radius:50%;
    display:grid; place-items:center; color:#fff; isolation:isolate; background:rgba(255,255,255,.02);
  }
  .pback svg{ filter:drop-shadow(0 1px 2px rgba(0,0,0,.35)); transition:transform .25s var(--ease); }
  .pback:hover svg{ transform:translateX(-3px); }
